<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="rocketh">
  <title>rocketh</title>
  <!--
    Simplified mark for favicon use ONLY. This is deliberately NOT logo.svg.

    At 16px, which is the size a browser tab actually renders, the full mark's
    fins, nose and plume merge into a blob. This glyph drops the fins entirely,
    reduces the Ethereum mark to its upper diamond with a single crease, and
    keeps one chunky plume. Three big shapes instead of eleven small ones.

    It is also upright rather than tilted 30 degrees. The tilt is a real part of
    the identity and losing it is a genuine cost, but a diagonal reads far worse
    than a symmetric shape once antialiasing has only a handful of pixels to
    work with. Legibility wins here because an illegible favicon communicates
    nothing at all.
  -->
  <!-- Ethereum diamond: two facets, lit from the left like the full mark -->
  <path d="M128 24 L40 140 L128 186 Z" fill="#b3b9c5"/>
  <path d="M128 24 L216 140 L128 186 Z" fill="#4a505c"/>
  <!-- plume: outer, mid, core -->
  <path d="M94 188 L128 246 L162 188 L128 208 Z" fill="#ff4d1c"/>
  <path d="M106 190 L128 232 L150 190 L128 205 Z" fill="#ffab00"/>
  <path d="M118 194 L128 220 L138 194 Z" fill="#ffe8a3"/>
</svg>
