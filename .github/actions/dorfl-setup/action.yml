name: Setup dorfl
description: Install Node.js, dorfl, the agent harness, and configure AI provider auth

inputs:
  ANTHROPIC_API_KEY:
    description: 'Provider API key, forwarded to the agent environment as ANTHROPIC_API_KEY.'
    required: false
    default: ''

# Project-toolchain boundary (task install-ci-document-toolchain-boundary):
# This composite action provisions ONLY what dorfl + the agent harness need.
# dorfl declares engines.node '>=18' and only PINS Node 22 below for its own
# runtime — it does NOT provision the project's own toolchain (a project-
# pinned package manager, a project Node version, rust, system packages,
# project-dep install steps, ...).
# A custom or conflicting project toolchain is supported ONLY via the
# project-setup hook (sibling task install-ci-project-setup-hook); without
# that hook the conflicting case is unsupported. install-ci does NOT detect
# a likely conflict — the boundary is documentation, not detection.
runs:
  using: composite
  steps:
    - name: Enable pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Setup Node for pnpm
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: pnpm
    - name: Install project deps
      shell: bash
      # --ignore-scripts: verify runs on fork pull requests; nothing in this
      # workspace needs an install-time script (the gate builds explicitly).
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Ensure a local main branch for changeset --since=main
      shell: bash
      run: |
        git fetch origin main --quiet || true
        if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
          git branch --force main origin/main
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        # setup-node (v5 and later) auto-enables package-manager caching. In v5
        # it probed whatever manager package.json's packageManager named, during
        # its own run and before that manager was on PATH, and crashed ("Unable
        # to locate executable file"). Since v6 it only fires when package.json
        # declares npm, and then fails if there is no npm lockfile. Either way
        # it is the project's cache, not dorfl's: dorfl provisions ONLY its own
        # runtime (toolchain boundary), so disable it explicitly.
        package-manager-cache: false

    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "dorfl[bot]"
        git config user.email "dorfl[bot]@users.noreply.github.com"

    # Pinned to the dorfl version that generated this action, so CI runs the
    # same CLI that wrote these workflows (and never an unreviewed `latest` in a
    # job holding write access and a provider key). Re-run `dorfl install-ci`
    # after upgrading dorfl to move the pin.
    - name: Install dorfl
      shell: bash
      run: npm install -g dorfl@0.14.3
    # Pinned to the exact harness version this dorfl release declares
    # (PI_HARNESS_VERSION): the job holds write access and a provider key, so the
    # version must not move on its own. Re-run `dorfl install-ci` to upgrade.
    - name: Install agent harness (pi)
      shell: bash
      run: npm install -g @earendil-works/pi-coding-agent@0.80.6

    - name: Configure agent models (models.json)
      shell: bash
      run: |
        mkdir -p ~/.pi/agent
        cat > ~/.pi/agent/models.json << 'MODELS_EOF'
        {
          "providers": {
            "anthropic": {
              "apiKey": "ANTHROPIC_API_KEY",
              "baseUrl": "https://claude.etherplay.io"
            }
          }
        }
        MODELS_EOF

    # Surface the configured provider API key(s) to the environment so the agent
    # step (`pi`) can resolve the env var `models.json` references. The workflow
    # passes the secret(s) via `with:` on the `uses:` line; we forward the
    # non-empty one(s) to `$GITHUB_ENV` (Actions masks the value in logs).
    - name: Export provider API key(s) to the environment
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.ANTHROPIC_API_KEY }}
      run: |
        if [ -n "${ANTHROPIC_API_KEY}" ]; then echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> "$GITHUB_ENV"; fi
