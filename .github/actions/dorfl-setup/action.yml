name: Setup dorfl
description: Install Node.js, dorfl, the agent harness, and configure AI provider auth

inputs:
  ANTHROPIC_API_KEY:
    description: 'Provider API key, forwarded to the agent environment as ANTHROPIC_API_KEY.'
    required: false
    default: ''

# Project-toolchain boundary (task install-ci-document-toolchain-boundary):
# This composite action provisions ONLY what dorfl + the agent harness need.
# dorfl declares engines.node '>=18' and only PINS Node 22 below for its own
# runtime — it does NOT provision the project's own toolchain (a project-
# pinned package manager, a project Node version, rust, system packages,
# project-dep install steps, ...).
# A custom or conflicting project toolchain is supported ONLY via the
# project-setup hook (sibling task install-ci-project-setup-hook); without
# that hook the conflicting case is unsupported. install-ci does NOT detect
# a likely conflict — the boundary is documentation, not detection.
runs:
  using: composite
  steps:
    - name: Enable pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Setup Node for pnpm
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: pnpm
    - name: Install project deps
      shell: bash
      # `--ignore-scripts` matches test.yml, release.yml and deploy.yml, which all
      # install this same lockfile without lifecycle scripts and are green. No
      # package in the workspace declares preinstall/install/postinstall/prepare
      # (only `prepublishOnly`, which runs at PUBLISH, not install), and the gate
      # this action feeds builds explicitly (`dorfl.json`'s verify runs `pnpm
      # build`), so nothing here depends on an install-time script. It matters
      # because verify.yml is reachable from a FORK's pull_request: without this a
      # dependency's postinstall runs on the runner before any gate does.
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Ensure a local main branch for changeset --since=main
      shell: bash
      run: |
        git fetch origin main --quiet || true
        if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
          git branch --force main origin/main
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        # setup-node@v5 auto-enables package-manager caching, which probes the
        # project package manager DURING its own run when a lockfile is present,
        # before that manager is on PATH, so the probe crashes ("Unable to
        # locate executable file"). dorfl provisions ONLY its own runtime and
        # leaves the project package-manager cache to the project (toolchain
        # boundary), so disable it explicitly.
        package-manager-cache: false

    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "dorfl[bot]"
        git config user.email "dorfl[bot]@users.noreply.github.com"

    # Both global installs are PINNED to an exact version. They run in jobs that
    # carry `contents: write` and an ANTHROPIC_API_KEY, so an unpinned `npm
    # install -g` resolves whatever `latest` is at RUN time: a compromised or
    # merely broken release reaches those credentials with no review and no
    # lockfile to catch it. Bump these deliberately, the way the SHA-pinned
    # `uses:` lines above are bumped.
    - name: Install dorfl
      shell: bash
      # Exactly the version the root package.json devDependency pins, so the
      # global CLI and the `dorflCmd` (node_modules/.bin/dorfl) in dorfl.json
      # cannot drift apart.
      run: npm install -g dorfl@0.13.0
    - name: Install agent harness (pi)
      shell: bash
      # 0.73.1 is what `latest` resolved to on 2026-09-26, so this pin changes
      # nothing about what installs today; it only stops the version moving on
      # its own. The repo pins no version for this package anywhere else, so
      # there is no other source to keep it in step with: bump it by hand when
      # a dorfl upgrade needs a newer harness.
      run: npm install -g @mariozechner/pi-coding-agent@0.73.1

    - name: Configure agent models (models.json)
      shell: bash
      run: |
        mkdir -p ~/.pi/agent
        cat > ~/.pi/agent/models.json << 'MODELS_EOF'
        {
          "providers": {
            "anthropic": {
              "apiKey": "ANTHROPIC_API_KEY",
              "baseUrl": "https://claude.etherplay.io"
            }
          }
        }
        MODELS_EOF

    # Surface the configured provider API key(s) to the environment so the agent
    # step (`pi`) can resolve the env var `models.json` references. The workflow
    # passes the secret(s) via `with:` on the `uses:` line; we forward the
    # non-empty one(s) to `$GITHUB_ENV` (Actions masks the value in logs).
    - name: Export provider API key(s) to the environment
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.ANTHROPIC_API_KEY }}
      run: |
        if [ -n "${ANTHROPIC_API_KEY}" ]; then echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> "$GITHUB_ENV"; fi
