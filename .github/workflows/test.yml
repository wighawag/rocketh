name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege, matching verify.yml. Without this block the job inherits the
# repository default, which is not necessarily read-only, for a job that only ever
# needs to read the code it tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # v4, matching release.yml and the dorfl-setup composite action. This job sat on
        # v3 while everything else moved, so the version that actually ran the tests was
        # not the version that ran the release.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: build packages
        run: pnpm build

      # BOTH halves: `pnpm typecheck` runs the per-package `tsc --noEmit` (src only) AND
      # `typecheck:tests`, which is the one that covers `test/` and `scripts/`. Nothing here
      # checked either before, so a test or a build script could reference a missing type
      # (or a missing `@types/node`) and only an editor would ever say so.
      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # The bundled Diamond artifacts are GENERATED from `packages/rocketh-diamond/
      # hardhat-deploy-v1/` but COMMITTED, because they determine the CREATE2 addresses of
      # the default facets and so must not be rebuilt during a release. This is what keeps
      # the two in step: it recompiles the vendored sources with the pinned solc (an npm
      # devDependency, no toolchain install needed) and fails if what is committed differs.
      # Editing Solidity without regenerating changes nothing on chain, and this is what
      # says so.
      - name: Check the bundled artifacts still match their sources
        run: pnpm verify:artifacts

      - name: Run Getting Started
        run: pnpm test:getting-started

      # Known advisories in the dependency tree, which is mostly build and docs tooling.
      # A hard gate on purpose: the repo already keeps security floors in package.json's
      # `pnpm.overrides`, so the way to answer this step is to add one there (or upgrade),
      # and a warning nobody has to act on would just accumulate. `--prod` is deliberately
      # NOT used: none of these packages ship to users, but they all run here, and a
      # compromised build tool is the supply-chain risk this repo is set up against.
      - name: Audit dependencies
        run: pnpm audit
