name: release

# Changesets release flow:
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) once you register it as a trusted publisher on
# each package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22, and a recent pnpm; publishes are stamped with provenance.
# NOTE: npm ties a trusted publisher to an existing package. All rocketh
# packages are already published, so registering this repo + workflow as a
# trusted publisher once (per package) is the only manual step; every release
# after that goes through this tokenless OIDC flow.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

# Every action here is pinned to a full commit SHA, with the release it belongs to
# in the trailing comment. This is the workflow that PUBLISHES to npm, so an action
# it runs can reach the OIDC token and the built artifacts: `@v4` is a MUTABLE tag
# the upstream owner (or anyone who takes over that account) can repoint at new code
# without us doing anything, and a SHA cannot be repointed. Pin the commit the tag
# resolved to, not the newest release, so pinning changes nothing by itself; update
# these deliberately, reading the diff between the two commits.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.3.0 (what the v4 tag points at; v4.4.0 exists but v4 was never moved to it)
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # MUST be v2 while @changesets/cli is v3, and the two are coupled in a way
      # that fails SILENTLY. v1 discovered what had been published by grepping the
      # publish command's stdout for `New tag: <pkg>@<ver>`; @changesets/cli v3
      # stopped printing that line, so v1 found nothing published, skipped pushing
      # tags AND creating GitHub releases, and still exited 0. Packages reached npm
      # while tags and releases silently stopped (last one 2026-08-11, the day the
      # CLI was bumped to ^3.0.0). v2 reads structured JSON events instead.
      #
      # So: do not bump @changesets/cli across a major without checking this action,
      # and do not downgrade this action without downgrading the CLI.
      - name: Create Release PR or Publish
        # v2 here is a BRANCH, not a tag, so it moved with every v2.x release. This is
        # its head as of 2026-08-17, which is also the v2.1.0 release commit.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # release:ci builds + format-checks then runs `changeset publish`.
          # No NPM_TOKEN: npm detects the OIDC environment and authenticates via
          # the registered trusted publisher. v2 dropped its own .npmrc handling,
          # which is fine because `setup-node` above sets `registry-url`.
          publish-script: pnpm release:ci
          # changeset:version runs `changeset version`, re-syncs the scaffold
          # template's pinned ranges, then refuses to let a pre-1.0 package
          # graduate to 1.x (see scripts/check-no-major-graduation.ts). A 0.x
          # `minor` is expressible: it is how a breaking pre-1.0 change gets a
          # version number a consumer's `^0.19.x` range will not silently take.
          version-script: pnpm changeset:version
          # v2 REQUIRES the token as an input: it no longer reads the GITHUB_TOKEN
          # environment variable, nor the credentials `actions/checkout` configures.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v2 changed the default to pushing commits/tags through the GitHub API.
          # Kept on the Git CLI, which is what v1 did here, so that fixing the tags
          # changes exactly one thing at a time.
          push-with-git-cli: true
