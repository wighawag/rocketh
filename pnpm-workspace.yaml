linkWorkspacePackages: true
packages:
  - 'packages/*'
  - 'website'
  # The demoes are workspace members, not standalone projects. They HAVE to be: each
  # declares `hardhat-deploy: workspace:*`, which cannot resolve outside a workspace, so
  # `pnpm install` inside one fails with "node_modules missing" and no way forward.
  #
  # Membership also makes them real consumers rather than decoration. Their `@rocketh/*`
  # dependencies are RANGES rather than `workspace:*`, so they stay copy-pasteable for a
  # user, and `linkWorkspacePackages` above links them to the local packages whenever the
  # range matches. Watch that last part: a package bumped PAST a demo's range silently
  # detaches it and it starts testing the published version instead.
  - 'demoes/hardhat-deploy/*'

# ---------------------------------------------------------------------------
# Supply-chain settings
#
# These live HERE and not in an .npmrc: pnpm reads only auth/registry settings
# from .npmrc, and from v11 that is enforced. The package manager itself is
# pinned in package.json (`packageManager: pnpm@10.28.1`), so the settings below
# are the ones that version understands.
# ---------------------------------------------------------------------------

# Do not install a version published less than 7 days ago (value is in MINUTES).
# Compromised releases are usually caught and unpublished within hours, so a
# waiting period is the cheapest defence against being the first to install one.
# It applies to transitive dependencies too, and only bites when something is
# RESOLVED: `pnpm install --frozen-lockfile` (CI, and the release workflow) is
# unaffected. If an urgent fix has to jump the queue, exempt exactly that
# package/version through the exclude list below rather than lowering this number.
minimumReleaseAge: 10080

# OUR OWN packages are exempt, and they have to be. `pnpm test:getting-started`
# walks the README's Getting Started, which runs `pnpm add -D ... rocketh
# @rocketh/node ...` against the REGISTRY from a directory inside this workspace,
# so the floor above applies to it. Measured on 2026-08-17: with the floor and no
# exemption that resolves rocketh 0.19.10 while 0.19.17 is published, and it does
# so SILENTLY. A release cadence of six versions in six days means the guide would
# be verified against a week-old rocketh, exactly when a fresh release most needs
# checking.
#
# The delay exists to protect us from packages whose publishing path we do not
# control, which is not true of these: they leave CI through trusted publishing
# from this repo. The cost is real and worth naming (if the npm account were
# compromised, an install here would take the bad version at once instead of
# waiting out the week) and it is accepted because the alternative is a
# permanently stale getting-started test.
minimumReleaseAgeExclude:
  # A QUEUE JUMP: one exact version each, checked by hand, so the floor keeps protecting
  # every later release of these packages. All three were published 2026-10-26 and are what
  # moves rocketh onto eip-1193 0.7, so the floor would hold that move for a week.
  #
  # - @eip-1193/jsonrpc-provider 0.5.0 and @eip-1193/signer 0.4.0: the EIP-1193 helpers,
  #   renamed onto the @eip-1193 scope (from eip-1193-jsonrpc-provider and eip-1193-signer).
  #   Both were published by their own release workflow over OIDC trusted publishing with an
  #   SLSA provenance attestation, by the same author as the unscoped names. Against the last
  #   unscoped versions (jsonrpc-provider 0.4.4, signer 0.2.0) the differences are the name,
  #   `eip-1193` moving from devDependencies to dependencies at ^0.7.0 (so the .d.ts imports
  #   it instead of inlining a stale 0.6.2 copy), the declared provider types, release
  #   tooling, and two runtime changes in the signer only: `eth_signTypedData` (v1) is now
  #   refused instead of being signed as v4, and wrapProviderWithMultipleSigners reads the
  #   signing address per method (personal_sign was routed by its message). rocketh signs
  #   neither, so neither change reaches it. jsonrpc-provider's runtime code is unchanged.
  # - eip-1193 0.7.1: types only (a single index.d.ts, no code, no dependencies), published
  #   by hand by the same author as every earlier release, as 0.7.0 was. It only ADDS
  #   CoreMethods and EIP1193CoreProvider to 0.7.0.
  #
  # Safe to delete any time after 2026-11-02, when all three pass the floor on their own.
  - '@eip-1193/jsonrpc-provider@0.5.0'
  - '@eip-1193/signer@0.4.0'
  - 'eip-1193@0.7.1'
  - 'rocketh'
  - '@rocketh/*'
  - 'hardhat-deploy'

# Refuse a version whose TRUST EVIDENCE is weaker than that of earlier releases of
# the same package. npm records how a version was published (trusted publishing via
# OIDC, provenance attestation, or nothing), and the shape of a hijacked release is
# precisely this: a package that always shipped from CI suddenly ships from
# somewhere with no such evidence. `minimumReleaseAge` above only DELAYS such a
# version and bets someone reports it in time; this refuses it outright, on a
# structural difference rather than on the community's reaction time. Judged by
# publish date, not semver, so a "patch" on an old branch cannot dodge it.
trustPolicy: no-downgrade

# ...but only for versions published within the last 30 days (value in MINUTES).
# Most of the registry's history predates provenance entirely, so without this the
# policy would demand a manual exemption for every old package in the tree. A
# hijack is by nature a FRESH publish, so restricting the check to fresh publishes
# keeps what the policy is for and drops the archaeology. Per-package escapes go in
# `trustPolicyExclude` if one is ever needed.
trustPolicyIgnoreAfter: 43200

# Transitive dependencies must come from the registry: no git repositories and
# no direct tarball URLs, which bypass the registry's release controls. Direct
# dependencies of the root package.json are still allowed to use them. Verified
# inert against the current lockfile, which resolves no exotic source at all.
blockExoticSubdeps: true

# Dependency lifecycle scripts (preinstall/install/postinstall) are the classic
# arbitrary-code-execution surface of an install. pnpm blocks unreviewed ones by
# default; `strictDepBuilds` turns that from a warning nobody reads into a failed
# install, so a NEW dependency arriving with a build script has to be looked at.
strictDepBuilds: true

# Reviewed decisions for the packages in the current tree that want to run one.
# All three are DENIED, which is what already happens today (nothing was ever
# approved here) and what the test/build/release flows already run against, so
# this records the status quo rather than changing behaviour. Add an entry, with
# a reason, only for a package that genuinely cannot work unbuilt.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  nx: false

# ---------------------------------------------------------------------------
# Security floors for TRANSITIVE dev/test/docs tooling deps flagged by `pnpm audit`.
#
# These live HERE, and not in package.json's `pnpm.overrides` where they used to sit,
# for the same reason as the settings above: pnpm 10.28 no longer reads that field. It
# says so on every install ("The "pnpm" field in package.json is no longer read by pnpm.
# The following keys were ignored: "pnpm.overrides""), which meant the whole floor below
# was silently inert, surviving only as a frozen `overrides:` block in the lockfile that
# the next re-resolution would have dropped.
#
# None of these are runtime deps of the published @rocketh/* packages (`pnpm audit --prod`
# is clean); they arrive through vitepress, hardhat, nx and lws. Only entries that still
# regress to a vulnerable version WITHOUT the override are kept: the vite advisories were
# resolved structurally by moving to vitepress 2.x (vite 8), so no vite override is needed.
# Two arrive through BUILD tooling rather than runtime: `tmp` through the pinned `solc`
# that regenerates the bundled diamond/proxy artifacts, and `brace-expansion` on two major
# lines: 5.x through nx, 1.x through that same `solc` (fs-extra > rimraf > glob >
# minimatch). `markdown-it` arrives through typedoc (API docs generation).
# The rest come from hardhat/lws (ws, adm-zip, @koa/cors, @tootallnate/once, undici via
# hardhat-zod-utils and hardhat-keystore), vite/vitepress peers (axios, esbuild, postcss
# via vite 8), nx (smol-toml, undici 7, follow-redirects), ipfs-gateway-emulator (hono) and
# wait-on (joi). The 2026-10-26 round added changesets (shell-quote, launch-editor), vitest
# (source-map-js, @vitest/mocker, vite 8), vitepress (@vue/server-renderer) and abitype in
# the demoes (zod 4). Revisit when those ship patched dep trees.
overrides:
  'axios@>=1.0.0 <1.20.0': ^1.20.0
  'esbuild@<0.25.0': ^0.25.0
  'esbuild@>=0.27.3 <0.28.1': ^0.28.1
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  'adm-zip@<0.6.1': ^0.6.1
  '@tootallnate/once@<2.0.1': ^2.0.1
  '@koa/cors@<5.0.0': ^5.0.0
  'undici@<6.29.1': ^6.29.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'postcss@<8.5.23': ^8.5.23
  'tmp@<0.2.6': ^0.2.6
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'markdown-it@<14.3.3': ^14.3.3
  'smol-toml@<1.9.0': ^1.9.0
  'hono@<4.13.11': ^4.13.11
  'joi@>=18.0.0 <18.2.9': ^18.2.9
  'shell-quote@>=1.8.4 <1.11.0': ^1.11.0
  'source-map-js@>=1.0.0 <1.2.2': ^1.2.2
  'follow-redirects@>=1.16.0 <1.16.1': ^1.16.1
  'launch-editor@<2.14.2': ^2.14.2
  '@vue/server-renderer@<3.5.42': ^3.5.42
  'vite@>=8.0.0 <8.1.6': ^8.1.6
  '@vitest/mocker@<4.1.12': ^4.1.12
  'zod@>=4.0.0 <4.6.6': ^4.6.6

# ONE advisory is ignored, and adding another should stay a last resort: an ignore entry
# is how a hard gate quietly becomes decoration. Each entry states why it cannot be fixed
# by a floor, why it does not reach users, and its exit condition.
#
# GHSA-mrhx-c7xc-m3w5 (zod, high, "through 4.6.5": a huge array against an unbounded array
# schema accumulates one issue per element until the process runs out of memory). The only
# remaining path is `hardhat-deploy > zod@3`, and the fix exists only on zod 4 (4.6.6).
# hardhat-deploy cannot move to zod 4: it hands its schema to Hardhat's
# `validateUserConfigZodType` (`@nomicfoundation/hardhat-zod-utils`), whose peer range is
# `zod ^3.23.8`, and `hardhat` itself depends on `zod ^3.23.8` (checked 2026-10-26 against
# hardhat 3.21.0 and hardhat-zod-utils 3.0.8, the latest). The schema hardhat-deploy
# validates is the developer's own `hardhat.config.ts` (`packages/hardhat-deploy/src/config/
# validation.ts`), never untrusted input, so the attacker the advisory needs is not there.
# The zod 4 copies elsewhere in the tree are floored to ^4.6.6 in `overrides` above.
# Exit condition: delete this entry when Hardhat accepts zod 4 and hardhat-deploy moves to
# zod >=4.6.6.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
