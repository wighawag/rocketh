# Old addresses of rocketh.dev pages that moved, each forwarded to where its
# content lives now. Read by the site (rocketh-website, `redirectsFile` of the
# template-svelte-docs engine), which writes a forwarding page per address and
# fails the build when a target is not a page or lacks the anchor named.
#
# A key with an `#anchor` forwards that one anchor of an old page on its own,
# for a page that was split: a reader arriving with it goes to where that
# section went, every other anchor goes to the page's own target. An anchor
# that is not listed is kept as the reader gave it.
#
# Every address the site served before the restructure is either still a page
# or listed here; rocketh-website's end-to-end suite checks all of them.

